[project]
name = "asc-sdk"
version = "0.3.0"
description = "Agent StateBoard (ASC) Python SDK — Agent 运行时状态治理层客户端"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asc"]
