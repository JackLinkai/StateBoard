spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/asc
    username: asc
    password: asc
  jpa:
    hibernate:
      ddl-auto: validate   # 先 validate，表用 SQL 建
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s          # 命令超时：Redis 故障时快速失败交给 HotStateCache 降级，而不是挂起
      connect-timeout: 2s

asc:
  compiler:
    default-budget-tokens: 1200